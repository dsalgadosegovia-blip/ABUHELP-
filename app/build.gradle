plugins {
    id 'com.android.application'
}
android {
    namespace 'cl.abuhelp.launcher'
    compileSdk 35
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'cl.abuhelp.launcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError true
        checkDependencies true
        htmlReport true
        xmlReport true
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
